<!DOCTYPE html>
<html>
<head>
  <title>CareerByChoice Assessment</title>
  <meta charset="UTF-8">
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#F4F7FA;
      margin:0;
    }

    header{
      background:#0A2E52;
      color:white;
      padding:20px;
      text-align:center;
    }

    .container{
      width:80%;
      margin:auto;
      padding:40px;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
      margin-top:20px;
    }

    button{
      background:#0E7490;
      color:white;
      padding:10px 20px;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    button:hover{
      background:#14B8A6;
    }
  </style>
</head>

<body>

<header>
  <h1>CareerByChoice Assessment Portal</h1>
</header>

<div class="container">

  <div class="card">
    <h2>Student Login</h2>

    <input type="text" id="name" placeholder="Enter your Name"><br><br>

    <button onclick="startAssessment()">Start Assessment</button>
  </div>

</div>

<script>
function startAssessment(){
  var student = document.getElementById("name").value;

  if(student === ""){
    alert("Please enter your name");
  } else {
    localStorage.setItem("student", student);
    window.location.href="assessment.html";
  }
}
</script>

</body>
</html>
