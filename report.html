<!DOCTYPE html>
<html>
<head>
<title>CareerByChoice Report</title>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

body{
  font-family: 'Poppins', sans-serif;
  margin:0;
  background:#F4F7FA;
  color:#1E293B;
}

.report-header{
  background:linear-gradient(90deg,#0A2E52,#0E7490);
  color:white;
  padding:40px;
  text-align:center;
}

.report-header h1{
  margin:0;
  font-weight:600;
}

.section{
  background:white;
  margin:50px auto;
  width:75%;
  padding:45px;
  border-radius:20px;
  box-shadow:0 15px 45px rgba(0,0,0,0.08);
}

h2{
  color:#0A2E52;
  font-weight:600;
  border-left:6px solid #0E7490;
  padding-left:15px;
}

.highlight{
  color:#0E7490;
  font-weight:600;
  font-size:20px;
}

.metric-card{
  background:#F8FAFC;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  border-left:5px solid #0E7490;
}

.page-divider{
  height:2px;
  background:#E2E8F0;
  margin:40px 0;
}

.footer{
  text-align:center;
  padding:40px;
  font-size:14px;
  color:#64748B;
}

</style>
</head>

<body>

<div class="report-header">
<h1>CareerByChoice Career Report</h1>
<p>Personalised Career Intelligence Assessment</p>
</div>

<div class="section">
<h2>Career Personality</h2>
<div class="metric-card">
<p id="personality"></p>
</div>
</div>

<div class="section">
<h2>Interest Profile (RIASEC)</h2>
<p id="interest"></p>
</div>

<div class="section">
<h2>Skills Summary</h2>
<p id="skills"></p>
</div>

<div class="section">
<h2>Recommended Career Cluster</h2>
<p id="cluster"></p>
</div>

<script>

let s=JSON.parse(localStorage.getItem("fullScores"));

// Personality
let personality=
(s.E>s.I?"Extrovert ":"Introvert ")+
(s.N>s.S?"Intuitive ":"Sensing ")+
(s.F>s.T?"Feeling ":"Thinking ")+
(s.J>s.P?"Judging":"Perceiving");

document.getElementById("personality").innerHTML=
"<span class='highlight'>"+personality+"</span> personality type identified.";

// Interest
let interestType="";
if(s.A>=1) interestType="Artistic";
else if(s.E_R>=1) interestType="Enterprising";
else if(s.S_R>=1) interestType="Social";
else interestType="Investigative";

document.getElementById("interest").innerHTML=
"<span class='highlight'>"+interestType+"</span> dominant interest area.";

// Skills
document.getElementById("skills").innerHTML=
"You demonstrated strong skills in "+s.skillHigh+" key competency areas.";

// Career Cluster Mapping
let cluster="";
if(interestType==="Artistic") cluster="Arts & Media Cluster";
else if(interestType==="Enterprising") cluster="Business & Marketing Cluster";
else if(interestType==="Social") cluster="Human Services Cluster";
else cluster="Research & Technology Cluster";

document.getElementById("cluster").innerHTML=
"<span class='highlight'>"+cluster+"</span> recommended based on profile.";

</script>

</body>
</html>
