<!DOCTYPE html>
<html>
<head>
  <title>Career Report</title>
  <meta charset="UTF-8">
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#F4F7FA;
      margin:0;
    }

    header{
      background:#0A2E52;
      color:white;
      padding:20px;
      text-align:center;
    }

    .container{
      width:80%;
      margin:auto;
      padding:40px;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
      margin-top:20px;
    }

    h2{
      color:#0A2E52;
    }

  </style>
</head>

<body>

<header>
  <h1>Career Assessment Report</h1>
</header>

<div class="container">
  <div class="card">
    <h2 id="personalityType"></h2>
    <h3>Career Motivation</h3>
    <p id="motivation"></p>

    <h3>Top Career Recommendation</h3>
    <p id="recommendation"></p>
  </div>
</div>

<script>

let scores = JSON.parse(localStorage.getItem("scores"));

let personality =
  (scores.E > scores.I ? "Extrovert" : "Introvert") + " - " +
  (scores.N > scores.S ? "Intuitive" : "Sensing") + " - " +
  (scores.F > scores.T ? "Feeling" : "Thinking") + " - " +
  (scores.J > scores.P ? "Judging" : "Perceiving");

document.getElementById("personalityType").innerText =
"Personality Type: " + personality;

if(scores.CREATIVE > 0){
  document.getElementById("motivation").innerText = "High Creativity Motivation";
  document.getElementById("recommendation").innerText =
  "Graphical Designing / Media / Creative Fields";
}
else if(scores.GOAL > 0){
  document.getElementById("motivation").innerText = "Achievement & Leadership Motivation";
  document.getElementById("recommendation").innerText =
  "Marketing / Business Management / Entrepreneurship";
}
else{
  document.getElementById("motivation").innerText = "Social Impact Motivation";
  document.getElementById("recommendation").innerText =
  "Human Services / Counselling / Social Work";
}

</script>

</body>
</html>
