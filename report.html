<!DOCTYPE html>
<html>
<head>
<title>Career Report</title>
<meta charset="UTF-8">
<style>
body{
  font-family:Arial;
  background:#F4F7FA;
  margin:0;
}
.section{
  background:white;
  width:80%;
  margin:40px auto;
  padding:30px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}
button{
  background:#0E7490;
  color:white;
  padding:12px 25px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
button:hover{
  background:#14B8A6;
}
</style>
</head>

<body>

<div class="section">
<h2>Career Report</h2>
<div id="output"></div>
<br>
<button onclick="downloadReport()">Download Report</button>
</div>

<script>

let raw = localStorage.getItem("fullScores");

if(!raw){
document.getElementById("output").innerHTML =
"No assessment data found. Please complete assessment first.";
}
else{

let s = JSON.parse(raw);

/* Deterministic Career Logic */

let careerList = [
{ name:"Graphic Designing", score: s.A*3 + s.skillHigh*2 },
{ name:"Marketing & Advertising", score: s.E_R*3 + s.E*2 },
{ name:"Human Services", score: s.S_R*3 + s.F*2 },
{ name:"Research & Analytics", score: s.I_R*3 + s.N*2 },
{ name:"Business Management", score: s.J*2 + s.E*2 }
];

careerList.sort((a,b)=>b.score-a.score);

let html = "<h3>Top Career Recommendations:</h3>";

careerList.forEach((career,index)=>{
let tag = "";
if(index===0) tag="⭐ Top Choice";
else if(index===1) tag="✔ Good Choice";
else tag="◉ Optional";

html += career.name + " - Score: " + career.score + " - " + tag + "<br>";
});

document.getElementById("output").innerHTML = html;
}

/* Download simple TXT report */
function downloadReport(){

let text = document.getElementById("output").innerText;

if(text===""){
alert("No report available.");
return;
}

let blob = new Blob([text], {type:"text/plain"});
let link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = "Career_Report.txt";
link.click();
}

</script>

</body>
</html>
